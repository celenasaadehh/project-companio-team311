# AWS App Runner build-from-source configuration.
#
# Hosts the therapist decision engine on AWS so the phone no longer needs the
# development Mac on the same network. Deploy from the console:
#   App Runner -> Create service -> Source: GitHub -> this repo, branch main
#   -> "Use a configuration file" (this one is found automatically).
#
# The DistilBERT weights (255 MB) exceed GitHub's file limit and are not in
# the repository, so the hosted engine runs WITHOUT the text-distress gate.
# The gate fails closed exactly as it does anywhere its model is absent, and
# /api/health/models reports it honestly. The Watch risk model, the stage
# recommender, the bandit, the safety filter, and the conditional-ban layer
# are all in the repository and fully live -- which is everything the
# camera-driven decision path uses. Torch/transformers are therefore left out
# of the hosted install: without their model they would be 2 GB of dead
# weight in every cold start.
version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install "pydantic[email]>=2.0" "fastapi>=0.110" "uvicorn>=0.29" "scikit-learn==1.6.1" "joblib>=1.3" "requests>=2.31"
run:
  runtime-version: 3.11
  command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8080 --app-dir therapist_engine
  network:
    port: 8080
  env:
    - name: PYTHONPATH
      value: /app/therapist_engine
